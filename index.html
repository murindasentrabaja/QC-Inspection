<!DOCTYPE html>
<html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>ERP Quality Control</title>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/exceljs@4.4.0/dist/exceljs.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js"></script>
<style>
:root{--bg:#f3f6fc;--ink:#16223b;--mut:#6b7794;--line:#e3e9f5;--p:#3b6cff;--g:#12b886;--r:#f03e5f;--a:#ff9f1c;--v:#7c4dff;--t:#00b3c4}
*{box-sizing:border-box;margin:0}[hidden]{display:none!important}
body{font:15px/1.5 'Nunito','Segoe UI',system-ui,sans-serif;color:var(--ink);background:var(--bg)}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid #3b6cff55;outline-offset:2px}
/* tombol + ripple */
.btn{position:relative;overflow:hidden;border:0;border-radius:12px;padding:9px 15px;font-weight:700;cursor:pointer;color:#fff;background:linear-gradient(135deg,var(--p),var(--v));box-shadow:0 6px 16px #3b6cff33;transition:transform .2s,box-shadow .2s}
.btn:hover{transform:translateY(-2px);box-shadow:0 10px 24px #3b6cff55}.btn:active{transform:scale(.96)}
.btn.xl{background:linear-gradient(135deg,#12b886,#0ca678)}.btn.pd{background:linear-gradient(135deg,#f03e5f,#ff6b6b)}.btn.pr{background:linear-gradient(135deg,#ff9f1c,#ff7a1c)}.btn.gh{background:#fff;color:var(--ink);border:1px solid var(--line);box-shadow:none}
.btn span.e{display:inline-block;transition:transform .3s}.btn:hover span.e{transform:rotate(-12deg) scale(1.25)}
.rp{position:absolute;border-radius:50%;background:#ffffff88;transform:scale(0);animation:rp .6s ease-out;pointer-events:none}
@keyframes rp{to{transform:scale(4);opacity:0}}
/* login */
#lg{position:fixed;inset:0;display:grid;place-items:center;overflow:hidden;background:linear-gradient(120deg,#dbe8ff,#e7dcff,#d5f5ee,#ffe9d2,#dbe8ff);background-size:400% 400%;animation:aur 16s ease infinite}
@keyframes aur{50%{background-position:100% 50%}}
.bl{position:absolute;border-radius:50%;filter:blur(50px);opacity:.55;animation:drift 14s ease-in-out infinite alternate}
.b1{width:340px;height:340px;background:#3b6cff;left:-80px;top:-60px}.b2{width:300px;height:300px;background:#ff9f1c;right:-60px;top:20%;animation-delay:-4s}.b3{width:380px;height:380px;background:#12b886;left:30%;bottom:-160px;animation-delay:-8s}.b4{width:240px;height:240px;background:#f03e5f;right:25%;top:-90px;animation-delay:-2s}
@keyframes drift{to{transform:translate(70px,50px) scale(1.2)}}
.fl{position:absolute;bottom:-60px;font-size:34px;opacity:.7;animation:up linear infinite}
@keyframes up{to{transform:translateY(-115vh) rotate(360deg)}}
.lc{position:relative;width:min(400px,92vw);padding:34px 30px;border-radius:26px;background:#ffffffc9;backdrop-filter:blur(18px);border:1px solid #fff;box-shadow:0 30px 70px #3b6cff33;display:grid;gap:8px;animation:pop .7s cubic-bezier(.2,1.2,.3,1)}
@keyframes pop{from{opacity:0;transform:translateY(30px) scale(.94)}}
.shk{animation:shk .4s}@keyframes shk{25%{transform:translateX(-10px)}75%{transform:translateX(10px)}}
.lc svg{width:74px;margin:0 auto}.lc h1{text-align:center;font-size:22px;font-weight:800}.lc p{text-align:center;color:var(--mut);margin-bottom:8px}
.lc label{font-weight:700;font-size:12px;color:var(--mut)}
.lc select,.lc input{width:100%;padding:12px 14px;border-radius:12px;border:1.5px solid var(--line);background:#fff;transition:.2s}
.lc select:focus,.lc input:focus{border-color:var(--p);box-shadow:0 0 0 4px #3b6cff22}
.pw{position:relative}.pw button{position:absolute;right:6px;top:6px;border:0;background:none;font-size:18px;cursor:pointer}
#er{color:var(--r);font-weight:600;min-height:18px;text-align:center}
.spin{stroke-dasharray:180;animation:dash 2.4s ease-in-out infinite}@keyframes dash{0%{stroke-dashoffset:180}60%,100%{stroke-dashoffset:0}}
/* loader */
#ld{position:fixed;inset:0;z-index:99;display:grid;place-content:center;justify-items:center;gap:18px;background:#f3f6fcee;backdrop-filter:blur(10px);opacity:0;visibility:hidden;transition:.3s}#ld.on{opacity:1;visibility:visible}
.gy{position:relative;width:130px;height:130px;display:grid;place-items:center}
.gy i{position:absolute;border-radius:50%;border:5px solid transparent}
.r1{inset:0;border-top-color:var(--p);border-left-color:var(--v);animation:sp 1.6s linear infinite}
.r2{inset:16px;border-right-color:var(--g);border-bottom-color:var(--t);animation:sp 1.1s linear infinite reverse}
.r3{inset:32px;border-top-color:var(--a);border-right-color:var(--r);animation:sp .8s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.hx{width:42px;height:46px;display:grid;place-items:center;color:#fff;font-weight:800;font-size:13px;clip-path:polygon(50% 0,100% 25%,100% 75%,50% 100%,0 75%,0 25%);background:linear-gradient(135deg,var(--p),var(--v));animation:pu 1.2s ease-in-out infinite}
@keyframes pu{50%{transform:scale(1.2);filter:hue-rotate(60deg)}}
.dt{position:absolute;width:11px;height:11px;border-radius:50%;left:50%;top:50%;margin:-5px;animation:ob 2.4s linear infinite}
.d1{background:var(--r)}.d2{background:var(--g);animation-delay:-.8s}.d3{background:var(--a);animation-delay:-1.6s}
@keyframes ob{from{transform:rotate(0) translateX(72px)}to{transform:rotate(360deg) translateX(72px)}}
#lm{font-weight:700;color:var(--ink)}#lm:after{content:'';animation:el 1.2s steps(4) infinite}@keyframes el{0%{content:''}25%{content:'.'}50%{content:'..'}75%,100%{content:'...'}}
.pb{width:190px;height:6px;border-radius:9px;background:var(--line);overflow:hidden}.pb s{display:block;height:100%;width:40%;border-radius:9px;background:linear-gradient(90deg,var(--p),var(--t),var(--g));animation:pg 1.3s ease-in-out infinite}
@keyframes pg{from{transform:translateX(-100%)}to{transform:translateX(260%)}}
/* app */
#app{display:grid;grid-template-columns:262px 1fr;min-height:100vh}
#sb{background:#fff;border-right:1px solid var(--line);padding:16px 12px;position:sticky;top:0;height:100vh;overflow:auto;z-index:20}
.brand{display:flex;gap:10px;align-items:center;padding:4px 8px 14px}.brand b{font-size:15px;font-weight:800;line-height:1.15}.brand small{display:block;color:var(--mut);font-weight:500}
.hx2{flex:none;width:38px;height:42px;display:grid;place-items:center;color:#fff;font-weight:800;font-size:12px;clip-path:polygon(50% 0,100% 25%,100% 75%,50% 100%,0 75%,0 25%);background:linear-gradient(135deg,var(--p),var(--v))}
#nv h6{font-size:11px;color:var(--mut);margin:14px 10px 4px;letter-spacing:.04em}
#nv a{position:relative;display:flex;align-items:center;gap:11px;padding:7px 10px;border-radius:13px;cursor:pointer;font-weight:600;overflow:hidden;transition:.25s}
#nv a:before{content:'';position:absolute;inset:0;background:linear-gradient(90deg,#3b6cff1c,transparent);transform:translateX(-101%);transition:.3s}
#nv a:hover:before,#nv a.on:before{transform:none}#nv a:hover{padding-left:15px}#nv a.on{background:#eef3ff;color:var(--p)}
.ic{position:relative;flex:none;width:34px;height:34px;border-radius:11px;display:grid;place-items:center;font-style:normal;font-size:18px;background:linear-gradient(135deg,var(--a),var(--b));box-shadow:0 6px 12px #16223b1f;animation:fy 3.6s ease-in-out infinite}
#nv a:hover .ic{animation:wg .6s}@keyframes fy{50%{transform:translateY(-2px)}}@keyframes wg{30%{transform:rotate(-16deg) scale(1.2)}60%{transform:rotate(12deg) scale(1.2)}}
main{min-width:0}.top{display:flex;align-items:center;gap:12px;padding:14px 26px;background:#ffffffcc;backdrop-filter:blur(10px);position:sticky;top:0;z-index:10;border-bottom:1px solid var(--line)}
.top h2{font-size:19px;font-weight:800;flex:1}.mb{display:block}.uc{display:flex;align-items:center;gap:9px;padding:5px 12px 5px 5px;border-radius:30px;background:#fff;border:1px solid var(--line)}.uc i{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;font-style:normal;background:linear-gradient(135deg,var(--t),var(--g));color:#fff;font-weight:800}.uc small{display:block;color:var(--mut);line-height:1}
#ct{padding:22px 26px 50px}
.kg{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:16px}
.kp{position:relative;overflow:hidden;border-radius:20px;padding:18px;background:#fff;border:1px solid var(--line);cursor:default;transition:.3s}
.kp:after{content:'';position:absolute;inset:0;background:linear-gradient(135deg,var(--c),transparent 70%);opacity:0;transition:.3s}.kp:hover{transform:translateY(-5px);box-shadow:0 18px 34px #16223b1a}.kp:hover:after{opacity:.1}
.kp .ic{width:46px;height:46px;font-size:24px;border-radius:15px}.kp b{display:block;font-size:32px;font-weight:800;margin-top:10px;line-height:1.1}.kp span{color:var(--mut);font-weight:600}
.pn{background:#fff;border:1px solid var(--line);border-radius:20px;padding:20px;margin-top:18px}.pn h3{font-size:15px;margin-bottom:12px}
.two{display:grid;grid-template-columns:1.6fr 1fr;gap:18px}
.ir{display:grid;grid-template-columns:150px 1fr 120px;gap:12px;align-items:center;padding:8px 0}.bar{display:flex;height:14px;border-radius:9px;overflow:hidden;background:var(--line)}.bar s{display:block;height:100%;width:0;transition:width 1.1s cubic-bezier(.2,.9,.3,1)}
.dn{width:160px;height:160px;border-radius:50%;margin:8px auto 14px;display:grid;place-items:center}.dn div{width:100px;height:100px;border-radius:50%;background:#fff;display:grid;place-items:center;font-weight:800;font-size:22px}
.lg{display:grid;gap:6px}.lg i{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:8px}
/* tabel */
.tl{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:14px}.tl input[type=search]{flex:1;min-width:180px;padding:10px 14px;border-radius:12px;border:1.5px solid var(--line);background:#fff}
.tw{background:#fff;border:1px solid var(--line);border-radius:18px;overflow:auto;max-height:calc(100vh - 230px)}
table{border-collapse:collapse;width:100%}th{position:sticky;top:0;background:#f6f8fd;text-align:left;padding:11px 13px;font-size:12px;color:var(--mut);white-space:nowrap}td{padding:10px 13px;border-top:1px solid var(--line);white-space:nowrap;max-width:280px;overflow:hidden;text-overflow:ellipsis}
tbody tr{transition:.2s}tbody tr:hover{background:#eef3ff;box-shadow:inset 4px 0 0 var(--p)}
.ch{display:inline-block;padding:2px 10px;border-radius:20px;font-weight:700;font-size:12px}.g{background:#d3f9e8;color:#0a8f64}.rd{background:#ffe0e6;color:#d0234a}.am{background:#fff0d1;color:#b46b00}.bl2{background:#e0e9ff;color:#2f57d6}
.ac button{border:0;background:#f1f4fb;border-radius:9px;width:32px;height:32px;cursor:pointer;font-size:15px;transition:.2s}.ac button:hover{transform:scale(1.2) rotate(-8deg);background:#e0e9ff}
.pg{display:flex;justify-content:space-between;align-items:center;margin-top:12px;color:var(--mut)}.em{text-align:center;padding:50px;color:var(--mut)}.em b{display:block;font-size:40px}
/* modal */
.ov{position:fixed;inset:0;z-index:50;display:grid;place-items:center;background:#16223b66;backdrop-filter:blur(6px);animation:fi .25s}@keyframes fi{from{opacity:0}}
.md{width:min(720px,94vw);max-height:90vh;overflow:auto;background:#fff;border-radius:24px;padding:24px;animation:pop .35s cubic-bezier(.2,1.2,.3,1)}
.md h3{font-size:18px;margin-bottom:14px}.fm{display:grid;grid-template-columns:1fr 1fr;gap:12px}.fg.full{grid-column:1/-1}.fg label{display:block;font-size:12px;font-weight:700;color:var(--mut);margin-bottom:4px}
.fg input,.fg select,.fg textarea{width:100%;padding:10px 12px;border-radius:11px;border:1.5px solid var(--line);background:#fff}.fg input:focus,.fg select:focus,.fg textarea:focus{border-color:var(--p);box-shadow:0 0 0 4px #3b6cff22;outline:0}
.fa{display:flex;justify-content:flex-end;gap:10px;margin-top:18px}
#ts{position:fixed;right:20px;bottom:20px;z-index:99;display:grid;gap:8px}.to{padding:12px 18px;border-radius:14px;color:#fff;font-weight:700;background:var(--g);box-shadow:0 12px 26px #16223b33;animation:pop .4s}.to.er{background:var(--r)}
@media(max-width:900px){#app{grid-template-columns:1fr}#sb{position:fixed;left:0;width:262px;transform:translateX(-105%);transition:.3s}#sb.open{transform:none;box-shadow:0 0 0 100vmax #16223b55}.mb{display:block}.two{grid-template-columns:1fr}.fm{grid-template-columns:1fr}.ir{grid-template-columns:1fr}#ct{padding:16px}}
@media(prefers-reduced-motion:reduce){*{animation-duration:.01s!important;animation-iteration-count:1!important;transition:none!important}}

/* logo, jam, sidebar */
.lgo{display:block;height:auto}.lc .lgo{width:220px;max-width:80%;margin:0 auto 6px}
.ck{text-align:right;line-height:1.25;white-space:nowrap}.ck b{display:block;font-size:13px}.ck small{color:var(--mut);font-variant-numeric:tabular-nums;font-weight:600}
.lc .ck{text-align:center;margin-bottom:6px}.lc .ck b{font-size:12px;color:var(--mut)}
#app{transition:grid-template-columns .3s}#app.hs{grid-template-columns:0 1fr}#app.hs #sb{padding:0;border:0;overflow:hidden}#sb{min-width:0}
#nv h6{display:flex;align-items:center;cursor:pointer;user-select:none;border-radius:10px;padding:6px 10px;margin:8px 0 2px}#nv h6:hover{background:#f1f4fb}
#nv h6 em{margin-left:auto;font-style:normal;background:var(--line);border-radius:10px;padding:0 7px}#nv h6 b{margin-left:8px;transition:transform .25s}
.gp.cl h6 b{transform:rotate(-90deg)}.gp.cl .gi{display:none}
.qb{display:block;margin:10px auto;width:220px;height:220px;border:1px solid var(--line);border-radius:12px;padding:8px;background:#fff}
@media(max-width:600px){.top .ck b{display:none}}

/* === tampilan modern === */
body{background:radial-gradient(800px 380px at 100% -8%,#e6dcff99,transparent),radial-gradient(700px 380px at 0 0,#d9e8ff99,transparent),var(--bg);background-attachment:fixed}
h1,h2,h3{letter-spacing:-.01em}
/* loading */
#ld{background:radial-gradient(circle at 50% 40%,#fffffff2,#eaf0ffee)}
.lo{position:relative;width:156px;height:156px;display:grid;place-items:center}
.lo:before{content:'';position:absolute;inset:20px;border-radius:50%;background:radial-gradient(circle,#3b6cff33,transparent 70%);animation:gl 1.8s ease-in-out infinite}
.rg{position:absolute;inset:0;border-radius:50%;background:conic-gradient(transparent 0 40%,#3b6cff,#7c4dff,#f03e5f,#ff9f1c,transparent);-webkit-mask:radial-gradient(farthest-side,transparent calc(100% - 5px),#000 calc(100% - 4px));mask:radial-gradient(farthest-side,transparent calc(100% - 5px),#000 calc(100% - 4px));animation:sp 1.5s linear infinite}
.lic{position:relative;width:96px;animation:bob 1.8s ease-in-out infinite;filter:drop-shadow(0 10px 14px #16223b33)}
@keyframes bob{50%{transform:translateY(-6px) scale(1.06)}}@keyframes gl{50%{transform:scale(1.2);opacity:.6}}
/* sidebar melayang */
#sb{margin:12px 0 12px 12px;top:12px;height:calc(100vh - 24px);border:1px solid #fff;border-radius:26px;background:linear-gradient(180deg,#fff,#f7f8ff);box-shadow:0 18px 50px #3b6cff1f,0 2px 6px #16223b0d;scrollbar-width:thin;transition:opacity .3s}
#app.hs #sb{margin:0;border-radius:0;box-shadow:none;opacity:0}
.brand{padding:6px 8px 12px;margin-bottom:4px;border-bottom:1px dashed var(--line)}
#nv{display:grid;gap:2px}
#nv h6{font-size:10.5px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;padding:8px 10px}
.gi{display:grid;gap:2px}.gp:not(.cl) .gi{animation:gi .3s ease}@keyframes gi{from{opacity:0;transform:translateY(-8px)}}
#nv a{gap:12px;padding:9px 12px;border-radius:14px;font-weight:700;color:#3a4763;transition:transform .25s,background .25s,color .25s,box-shadow .25s}
#nv a:before{background:linear-gradient(90deg,color-mix(in srgb,var(--a) 16%,transparent),transparent)}
#nv a:hover{padding-left:12px;transform:translateX(5px);color:var(--ink)}
#nv a.on{background:linear-gradient(120deg,var(--a),var(--b));color:#fff;transform:translateX(3px);box-shadow:0 10px 22px color-mix(in srgb,var(--a) 42%,transparent)}
#nv a.on:before{display:none}
#nv .ic{width:26px;height:26px;border-radius:0;background:none;box-shadow:none;animation:none;font-size:21px;filter:drop-shadow(0 3px 3px color-mix(in srgb,var(--a) 50%,transparent))}
#nv a.on .ic{filter:drop-shadow(0 2px 3px #0004)}
/* tombol hide menu */
.tg{flex:none;width:42px;height:42px;border:0;border-radius:14px;cursor:pointer;display:grid;place-content:center;gap:5px;background:linear-gradient(135deg,#eef3ff,#f3eaff);box-shadow:inset 0 0 0 1px #dfe6fb,0 4px 12px #3b6cff1f;transition:transform .25s,box-shadow .25s}
.tg:hover{transform:translateY(-1px);box-shadow:inset 0 0 0 1px #c9d6ff,0 8px 18px #3b6cff33}.tg:active{transform:scale(.92)}
.tg i{display:block;width:20px;height:2.5px;border-radius:3px;background:linear-gradient(90deg,var(--p),var(--v));transform-origin:left center;transition:transform .35s cubic-bezier(.3,1.4,.5,1),width .3s,opacity .25s}
.tg.x i:nth-child(1){width:12px;transform:translate(4px,7.5px) rotate(-42deg)}.tg.x i:nth-child(2){opacity:0;transform:scaleX(0)}.tg.x i:nth-child(3){width:12px;transform:translate(4px,-7.5px) rotate(42deg)}
@media(max-width:900px){#sb{margin:0;top:0;height:100vh;border-radius:0 26px 26px 0}}

/* tamu, refresh, progress, skeleton */
.lc .sep{display:flex;align-items:center;gap:10px;color:var(--mut);font-size:12px;font-weight:700}.lc .sep:before,.lc .sep:after{content:'';flex:1;height:1px;background:var(--line)}
#gs{padding:12px;border:1.5px dashed #c9d6ff;color:var(--p)}#gs:hover{background:#f3f6ff}
.gb{flex:none;padding:5px 12px;border-radius:20px;font-weight:800;font-size:12px;color:#b46b00;background:#fff0d1;border:1px solid #ffd99a;white-space:nowrap}
.rfw{display:flex;align-items:center;gap:8px}.rfw small{color:var(--mut);font-weight:600;font-variant-numeric:tabular-nums;white-space:nowrap}
#rf{padding:8px 13px;white-space:nowrap}#rf:disabled{opacity:.7;cursor:progress}#rf.spinning .e{animation:sp 1s linear infinite}
#tp{position:fixed;top:0;left:0;right:0;height:3px;z-index:100;opacity:0;transition:opacity .25s;overflow:hidden;pointer-events:none}#tp.on{opacity:1}
#tp:before{content:'';display:block;height:100%;width:40%;border-radius:3px;background:linear-gradient(90deg,var(--p),var(--t),var(--g));animation:pg 1.1s ease-in-out infinite}
.sk{border:0;background:linear-gradient(90deg,#eef2fb 25%,#f8faff 50%,#eef2fb 75%);background-size:200% 100%;animation:shm 1.2s linear infinite}@keyframes shm{to{background-position:-200% 0}}
@media(max-width:700px){.rfw small,#rf .rl{display:none}.top{flex-wrap:wrap;gap:8px}}
</style></head><body>
<!-- LOGIN -->
<div id="lg"><span class="bl b1"></span><span class="bl b2"></span><span class="bl b3"></span><span class="bl b4"></span>
<span class="fl" style="left:8%;animation-duration:17s">⚙️</span><span class="fl" style="left:24%;animation-duration:22s;animation-delay:-6s">🔩</span><span class="fl" style="left:46%;animation-duration:19s;animation-delay:-3s">🛡️</span><span class="fl" style="left:66%;animation-duration:24s;animation-delay:-11s">📐</span><span class="fl" style="left:85%;animation-duration:20s;animation-delay:-8s">✅</span>
<form class="lc" id="lf" autocomplete="off">
<img class="lgo" alt="PT Murinda Sentra Baja">
<h1>ERP Quality Control</h1><p>Masuk untuk mengelola mutu produksi</p><div class="ck"><b class="cdt"></b><small class="ctm"></small></div>
<label for="un">Pengguna</label><select id="un"></select>
<label for="pw">Kata sandi</label><div class="pw"><input id="pw" type="password" placeholder="Ketik kata sandi" required><button type="button" id="eye" aria-label="Tampilkan sandi">👁️</button></div>
<button class="btn" style="margin-top:8px;padding:13px">Masuk ke sistem</button><div class="sep">atau</div><button type="button" class="btn gh" id="gs">👁️ Masuk sebagai tamu (hanya lihat)</button><div id="er"></div></form></div>
<!-- LOADER -->
<div id="ld" class="on"><div class="lo"><i class="rg"></i><img class="lic" alt=""></div><p id="lm">Menyiapkan portal</p><div class="pb"><s></s></div></div>
